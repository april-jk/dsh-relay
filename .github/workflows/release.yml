name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const packageJson = require('./package.json');
          const packageLock = require('./package-lock.json');
          const expectedTag = `v${packageJson.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} must match package version ${expectedTag}`);
          }
          if (packageLock.version !== packageJson.version ||
              packageLock.packages?.['']?.version !== packageJson.version) {
            throw new Error('package.json and package-lock.json versions do not match');
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build and publish the Relay container
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/dsh-relay"
          version="${RELEASE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "${image}:${version}" -t "${image}:latest" .
          docker push "${image}:${version}"
          docker push "${image}:latest"
      - name: Package release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive_root="dsh-relay-${version}"
          output_dir="release"
          mkdir -p "${output_dir}/${archive_root}"
          cp -R dist "${output_dir}/${archive_root}/dist"
          cp package.json package-lock.json README.md README.zh-CN.md LICENSE \
            .env.example Dockerfile compose.yml railway.json \
            "${output_dir}/${archive_root}/"
          tar -C "${output_dir}" -czf "${output_dir}/dsh-relay-${RELEASE_TAG}.tar.gz" "${archive_root}"
          (cd "${output_dir}" && zip -qr "dsh-relay-${RELEASE_TAG}.zip" "${archive_root}")
          (cd "${output_dir}" && sha256sum \
            "dsh-relay-${RELEASE_TAG}.tar.gz" \
            "dsh-relay-${RELEASE_TAG}.zip" > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/dsh-relay-"${GITHUB_REF_NAME}".tar.gz \
              release/dsh-relay-"${GITHUB_REF_NAME}".zip \
              release/SHA256SUMS \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              release/dsh-relay-"${GITHUB_REF_NAME}".tar.gz \
              release/dsh-relay-"${GITHUB_REF_NAME}".zip \
              release/SHA256SUMS \
              --verify-tag \
              --title "dsh-relay ${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
